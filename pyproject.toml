[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miniai_pj"
dynamic = ["version"]
description = "MiniAI project (student practice)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "ChiNguyen", email = "chinpforwork@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/chinpforwork/miniai_pj"
Documentation = "https://chinpforwork.github.io/miniai_pj/"

[project.entry-points.nbdev]
miniai_pj = "miniai._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "miniai.__version__"}

[tool.setuptools.packages.find]
include = ["miniai"]

[tool.nbdev]
lib_path = "miniai"
